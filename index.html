<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="にぎにぎ">
<title>にぎにぎ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="start">
  <h1>にぎにぎ</h1>
  <p class="lead">スマホのカメラ越しに、足元の近くを、まるいおともが、ついてきます。</p>

  <label for="size">おおきさ</label>
  <select id="size">
    <option value="0.3">小さい(30 cm)</option>
    <option value="0.5" selected>ふつう(50 cm)</option>
    <option value="0.8">大きい(80 cm)</option>
  </select>

  <label for="dist">はなれる距離(あなたからの半径)</label>
  <select id="dist">
    <option value="1">近め(1 m)</option>
    <option value="1.6">少し近め(1.6 m)</option>
    <option value="2" selected>ふつう(2 m)</option>
    <option value="3">遠め(3 m)</option>
    <option value="4">もっと遠く(4 m)</option>
  </select>

  <label for="eye">スマホを持つ高さ(目線)</label>
  <select id="eye">
    <option value="1.2">低め(1.2 m)</option>
    <option value="1.4" selected>ふつう(1.4 m)</option>
    <option value="1.6">高め(1.6 m)</option>
  </select>

  <label for="bgm">音楽(自分のビデオか、音声のファイル)</label>
  <input type="file" id="bgm" accept="audio/*,video/*">
  <p class="msg" id="bgmMsg">選ぶと、その音を、ループで流します。おともが視界にいる間は大きく、外れると小さくなります。</p>
  <button type="button" id="bgmClear" class="small">保存した音を消す</button>

  <button type="button" id="go" class="primary">はじめる</button>
  <p class="msg" id="msg" role="status"></p>

  <ul class="tips">
    <li>はじめに、モーションとカメラの許可を求められます。位置情報は使いません。</li>
    <li>スマホを、足元に向けてください。おともが歩いています。</li>
    <li>はじめから、踊ります。「ダンスをやめる」を押すと、踊りも音も止まります。</li>
    <li>おともを、タップすると、ぴょんと跳ねます。</li>
    <li>映像は、この端末の中だけで使います。どこにも送りません。</li>
  </ul>
</main>

<video id="cam" playsinline muted autoplay></video>
<div id="host"></div>
<div id="hud" hidden>
  <button type="button" id="exit">戻る</button>
  <button type="button" id="dance">ダンスをやめる</button>
  <div id="find" aria-live="polite"></div>
</div>

<script src="app.js"></script>
</body>
</html>
